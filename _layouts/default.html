<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/profile_pic.jpg' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="top">
    <div class="wrap nav__inner">
      <a class="nav__brand" href="{{ '/' | relative_url }}" aria-label="Mayuree Binjolkar home"><span>{{ site.data.profile.name }}</span></a>
      <button class="nav__toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation"><span></span><span></span></button>
      <nav class="nav__links" id="site-navigation" aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/blog/' | relative_url }}">Writing</a>
        <a class="nav__cv" href="{{ site.data.profile.resume_url | relative_url }}">CV <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="footer"><div class="wrap footer__inner"><span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span><a href="#top">Back to top ↑</a></div></footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
